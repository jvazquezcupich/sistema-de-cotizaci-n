<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'self'">
  <title>Chat Mistral · Multicotizador</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <h1>Asistente del Multicotizador</h1>
      <p>Chat con <code>mistral-small-latest</code> · la API key vive solo en el servidor</p>
    </header>
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input id="input" type="text" placeholder="Escribe tu mensaje…" autocomplete="off" required maxlength="4000">
      <button type="submit" id="send">Enviar</button>
    </form>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
