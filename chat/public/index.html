<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · Mistral</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #f4f5f7; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a1a2e; color: #fff; padding: 14px 20px; }
    main { flex: 1; overflow-y: auto; padding: 20px; }
    #mensajes { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: #1a1a2e; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #fff; border: 1px solid #dcdddf; border-bottom-left-radius: 4px; }
    .error { align-self: center; background: #fdecea; color: #b3261e; border: 1px solid #f5c6c2; font-size: 13px; }
    form { display: flex; gap: 8px; padding: 12px 20px; max-width: 800px; margin: 0 auto; width: 100%; }
    input { flex: 1; padding: 12px 14px; border: 1px solid #dcdddf; border-radius: 10px; font-size: 15px; outline: none; }
    button { padding: 12px 20px; background: #1a1a2e; color: #fff; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; }
    button:disabled { background: #6b6c70; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Chat · Mistral</h1>
    <small>Modelo: mistral-small-latest</small>
  </header>
  <main>
    <div id="mensajes">
      <div class="msg bot">¡Hola! Escribe un mensaje para empezar a chatear.</div>
    </div>
  </main>
  <form id="form">
    <input id="entrada" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" />
    <button id="enviar" type="submit">Enviar</button>
  </form>
  <script>
    const form = document.getElementById("form");
    const entrada = document.getElementById("entrada");
    const enviar = document.getElementById("enviar");
    const mensajes = document.getElementById("mensajes");

    function agregar(texto, clase) {
      const div = document.createElement("div");
      div.className = "msg " + clase;
      div.textContent = texto;
      mensajes.appendChild(div);
      mensajes.scrollIntoView(false);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const texto = entrada.value.trim();
      if (!texto) return;

      agregar(texto, "user");
      entrada.value = "";
      enviar.disabled = true;

      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: texto }),
        });
        const data = await r.json();
        if (data.reply) {
          agregar(data.reply, "bot");
        } else {
          agregar(data.error || "Respuesta no válida del servidor.", "error");
        }
      } catch {
        agregar("No se pudo conectar con el servidor.", "error");
      } finally {
        enviar.disabled = false;
        entrada.focus();
      }
    });
  </script>
</body>
</html>
