<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.mistral.ai; img-src data:; form-action 'none'; base-uri 'none'">
  <title>Chat Mistral · Multicotizador (HTML único)</title>
  <style>
    :root {
      --green: #166534;
      --green-dark: #0f3d22;
      --bg: #eef2f6;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .chat {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--green-dark);
      color: #fff;
    }
    .chat-header h1 { margin: 0; font-size: 1.1rem; }
    .chat-header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.85; }
    .chat-header code { background: rgba(255,255,255,0.15); padding: 1px 5px; border-radius: 4px; }
    .keybar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.8rem;
    }
    .keybar input[type="password"] {
      flex: 1;
      min-width: 220px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .keybar label { display: flex; gap: 4px; align-items: center; color: #475569; white-space: nowrap; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { display: flex; }
    .msg-user { justify-content: flex-end; }
    .msg-assistant { justify-content: flex-start; }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .msg-user .bubble { background: var(--green); color: #fff; border-bottom-right-radius: 4px; }
    .msg-assistant .bubble { background: #f1f5f9; color: var(--text); border-bottom-left-radius: 4px; }
    .bubble.error { background: #fef2f2; color: var(--danger); }
    .chat-form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .chat-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .chat-form button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .chat-form button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <h1>Asistente del Multicotizador</h1>
      <p>Chat con <code>mistral-small-latest</code> · archivo HTML único, sin servidor</p>
    </header>
    <div class="keybar">
      <input id="apikey" type="password" placeholder="Pega aquí tu MISTRAL_API_KEY (no se guarda en este archivo)" autocomplete="off">
      <label><input id="remember" type="checkbox"> Recordarla en este navegador</label>
    </div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="chat-form" class="chat-form">
      <input id="input" type="text" placeholder="Escribe tu mensaje…" autocomplete="off" required maxlength="4000">
      <button type="submit" id="send">Enviar</button>
    </form>
  </main>
  <script>
    const API_URL = "https://api.mistral.ai/v1/chat/completions";
    const MODEL = "mistral-small-latest";
    const STORAGE_KEY = "mistral_api_key";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendButton = document.getElementById("send");
    const messagesEl = document.getElementById("messages");
    const apikeyEl = document.getElementById("apikey");
    const rememberEl = document.getElementById("remember");
    const history = [];

    const savedKey = localStorage.getItem(STORAGE_KEY);
    if (savedKey) {
      apikeyEl.value = savedKey;
      rememberEl.checked = true;
    }

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = `msg msg-${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      div.appendChild(bubble);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      const apiKey = apikeyEl.value.trim();
      if (!text) return;
      if (!apiKey) {
        addMessage("assistant", "Pega primero tu MISTRAL_API_KEY en el campo superior.").classList.add("error");
        return;
      }
      if (rememberEl.checked) localStorage.setItem(STORAGE_KEY, apiKey);
      else localStorage.removeItem(STORAGE_KEY);
      input.value = "";
      sendButton.disabled = true;
      addMessage("user", text);
      const typing = addMessage("assistant", "Escribiendo…");
      history.push({ role: "user", content: text });
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${apiKey}`,
          },
          body: JSON.stringify({ model: MODEL, messages: history }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = data?.detail || data?.message || `HTTP ${res.status}`;
          throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
        }
        const reply = data?.choices?.[0]?.message?.content ?? "";
        typing.textContent = reply || "(respuesta vacía)";
        history.push({ role: "assistant", content: typeof reply === "string" ? reply : "" });
      } catch (err) {
        history.pop();
        typing.textContent = `Error: ${err.message}`;
        typing.classList.add("error");
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
